name: Parser tests

on:
  pull_request:
    paths:
      - "scraper/**"
      - ".github/workflows/parser-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Run parser regression tests
        run: python -m unittest discover -s scraper -p "test*.py" -v
