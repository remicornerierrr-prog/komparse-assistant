name: Komparse scraper

on:
  push:
    branches:
      - main
    paths:
      - "scraper/**"
      - ".github/workflows/komparse.yml"

  # Vérification toutes les 5 minutes pour réduire le délai de détection.
  # GitHub Actions peut malgré tout retarder certaines exécutions planifiées.
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      # Les tests signalent les régressions, mais ne doivent jamais bloquer
      # le scraper automatique : l'utilisateur a explicitement choisi ce mode.
      - name: Run unit tests (non-blocking)
        id: unit_tests
        run: python -m unittest discover -s scraper -t .
        continue-on-error: true

      - name: Warn if unit tests failed
        if: ${{ steps.unit_tests.outcome == 'failure' }}
        run: |
          echo "::warning::Unit tests failed, but the scraper will continue."

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python scraper/main.py
